# Workflow de Integração Contínua responsável por executar os testes unitários.
# Estrutura preparada para futuras expansões, mantendo um único job dedicado aos testes.

name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: "24"
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: augustotepedino-6354s-projects

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Obtém o código-fonte do repositório.
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      # Configura a versão do Node.js utilizada pelo projeto.
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn.
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Executa os testes unitários.
      - name: Run unit tests
        run: yarn test

  build-and-deploy:
    name: build & deploy vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      # 1. Obtém o código-fonte do repositório.
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      # 2. Configura a versão do Node.js utilizada pelo projeto.
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn.
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto.
      - name: Install dependencies
        run: yarn install

      # 5. Obter configurações do vercel
      - name: Pull Vercel Config
        run: |
          yarn vercel pull --yes \
          --environment=preview \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE

      # 6. Build Vercel
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # 7. Deploy Preview no Vercel
      - name: Vercel Deploy Preview
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt \
          --target=preview \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE) 
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run E2E Tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest

    steps:
      # 1. Obtém o código-fonte do repositório.
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      # 2. Configura a versão do Node.js utilizada pelo projeto.
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn.
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 5. Instalação Chrome
      - name: Install Playwright Browsers
        run: yarn playwright install --with-deps chromium

      # 6. Executa testes de Regressão
      - name: Run E2E Regression
        run: |
          yarn playwright test
          echo "The URL is: ${{ needs.build-and-deploy.outputs.deployment-url }}"
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}

      # 7. relatorio de testes automatizados
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report

  promote:
    name: Promote to Production
    needs: [build-and-deploy, e2e-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Vercel promote
        run: |
          npx vercel@latest promote ${{ needs.build-and-deploy.outputs.deployment-url }} \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE \
          --yes
